<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A.S.T.R.A. Dashboard | Autonomous Trading Engine</title>
    
    <!-- Dependencies -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <!-- Custom Style Component -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="p-2 md:p-4">
    <div class="max-w-7xl mx-auto">
        
        <!-- COMPONENT: Header -->
        {% include 'components/header.html' %}

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- COMPONENT: Main Content (Reports, Tabs, Bottom Radar) -->
            {% include 'components/main_content.html' %}

            <!-- COMPONENT: Sidebar (Market Stats, Controls) -->
            {% include 'components/sidebar.html' %}

        </div>
    </div>

    <!-- COMPONENT: Modals Overlay System -->
    {% include 'components/modals.html' %}

    <!-- Main JS Application -->
    <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
</body>
</html>
